<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人网页 - 首页</title>

    <meta name="keywords" content="个人博客，技术笔记，前端开发，学习笔记">
    <meta name="author" content="画风">
    <!-- Open Graph -->
    <meta property="og:title" content="我的个人网页 - 首页">
    <meta property="og:description" content="记录生活，分享思考，持续成长">
    <meta property="og:type" content="website">
    <!-- Iconfont 图标库 -->
    <link rel="preload" href="./assets/css/style.css" as="style">
    <link rel="preload" href="./assets/css/iconfont.css" as="style">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/iconfont.css">
    <link rel="stylesheet" href="./assets/css/home.css">

<body>
    <script type="module">
        import { renderHeader, renderFooter } from './assets/js/common.js';
        renderHeader();
        renderFooter();
    </script>

    <!-- 第一屏：欢迎区域 -->
    <section class="home-section section-welcome">
        <div class="section-content">
            <div class="scroll-indicator">
                <span>向下滚动</span>
                <div class="scroll-arrow"></div>
            </div>
            <div class="content-wrapper">
                <h1 class="animate-text">欢迎来到我的在线笔记</h1>
                <p class="animate-text delay-1">这里是我个人学习、生活感悟及技术实践的记录空间，并非公开宣传的站点</p>
                <p class="animate-text delay-2">如果你偶然间访问到了这里，那或许就是一种奇妙的缘分</p>
            </div>
        </div>
    </section>

    <!-- 第二屏：理念与技术区域 -->
    <section class="home-section section-philosophy">
        <div class="section-content">
            <div class="content-wrapper">
                <h2 class="animate-text">网站设计遵循<span class="highlight">"更简单、更纯粹"</span>的原则</h2>
                <p class="animate-text delay-1 tech-note">一个纯静态的网站，仅使用原生的 HTML、CSS 和 JavaScript 构建，直接解析本地 Markdown 文件展示
                </p>
                <p class="animate-text delay-2">这里包含了我的思想理念，记录了我的成长轨迹，也见证了我与众多先行者思想的碰撞与共鸣</p>
                <p class="animate-text delay-3">对于意外到访的你，如果有任何建议或想法，欢迎通过关于界面的联系方式与我沟通</p>

                <!-- 技术栈展示 -->
                <div class="tech-stack-section animate-text delay-4">
                    <h3 class="tech-title">本站使用技术·鸣谢</h3>
                    <div class="tech-stack" id="techStack">
                        <div class="loading">加载技术栈信息中...</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script type="module" src="./assets/js/index.js"></script>
    <script type="module" src="./assets/js/home-scroll.js"></script>
