<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章归档 - 我的个人网页</title>
    <meta name="description" content="按分类和时间浏览所有文章，查看完整的内容索引和统计信息">
    <meta name="keywords" content="文章归档，分类目录，时间线，内容索引">
    <meta name="author" content="画风">
    <link rel="icon" href="./assets/images/favicon.ico">
    <link rel="stylesheet" href="./assets/css/iconfont.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/archive.css">
    <script src="./assets/js/marked.min.js" defer></script>
</head>
<body>
    <script type="module">
        import { renderHeader, renderFooter } from './assets/js/common.js';
        renderHeader();
        renderFooter();
    </script>

    <div class="container">
        <div class="archive-header">
            <h1>文章归档</h1>
            <p>按分类和时间整理的所有文章</p>
        </div>

        <!-- 统计概览 -->
        <div class="stats-overview" id="statsOverview">
            <div class="loading">加载统计信息中...</div>
        </div>

        <!-- 分类目录 -->
        <div class="archive-section">
            <h2 class="section-title">
                <span class="icon">📁</span>
                <span>分类目录</span>
            </h2>
            <div class="categories-container" id="categoriesContainer">
                <div class="loading">加载分类中...</div>
            </div>
        </div>

        <!-- 时间线 -->
        <div class="archive-section">
            <h2 class="section-title">
                <span class="icon">⏰</span>
                <span>时间线</span>
            </h2>
            <div class="timeline" id="timeline">
                <div class="loading">加载时间线中...</div>
            </div>
        </div>
    </div>

    <script type="module" src="./assets/js/archive.js"></script>
</body>
</html>
