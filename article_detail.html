<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重定向中 - 我的个人网页</title>
    <meta name="description" content="文章重定向页面">
    <meta name="author" content="画风">
    <link rel="icon" href="./assets/images/favicon.ico">
    <script>
        // 获取URL参数
        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }
        
        // 从索引文件查找对应的HTML文件
        async function redirectToStaticHtml() {
            const fileName = getUrlParam('fileName');
            if (!fileName) {
                document.getElementById('error').textContent = '无效的文章链接！';
                return;
            }
            
            try {
                // 加载索引文件
                const response = await fetch('./articles_index.json');
                const indexData = await response.json();
                
                // 查找对应的文章
                const article = indexData.articles.find(a => a.fileName === fileName);
                
                if (article && article.htmlFile) {
                    // 重定向到静态HTML文件
                    window.location.href = `./articles_html/${article.htmlFile}`;
                } else {
                    document.getElementById('error').textContent = '文章未找到！';
                }
            } catch (error) {
                console.error('重定向失败:', error);
                document.getElementById('error').textContent = '重定向失败，请刷新重试！';
            }
        }
        
        // 页面加载后执行重定向
        document.addEventListener('DOMContentLoaded', redirectToStaticHtml);
    </script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; padding: 20px;">
        <h1>文章重定向中...</h1>
        <p>如果长时间没有跳转，请点击 <a href="articles.html">返回文章列表</a></p>
        <p id="error" style="color: #ef4444;"></p>
    </div>
</body>
</html>
